[project]
name = "sentinel-ai"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "ultralytics>=8.3",
  "open-clip-torch>=2.24",
  "pillow>=10",
  "pydantic>=2.8",
  "openai>=1.60",
  "httpx>=0.27",
  "meta-sam-parser==0.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47"]

[tool.uv]
package = false
